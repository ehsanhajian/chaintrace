[project]
name = "chaintrace"
version = "0.1.0"
description = "See what a blockchain node is doing, from the process table and a short kernel trace."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
  "ebpf",
  "bpftrace",
  "ethereum",
  "geth",
  "lighthouse",
  "security",
  "node",
]
authors = [{ name = "ehsanhajian" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/ehsanhajian/chaintrace"
Issues = "https://github.com/ehsanhajian/chaintrace/issues"
Changelog = "https://github.com/ehsanhajian/chaintrace/releases"

[project.scripts]
chaintrace = "chaintrace.cli:main"

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chaintrace = ["clients.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
